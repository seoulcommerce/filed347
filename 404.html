<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Filed347</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { 
      --ink: #1c1917;
      --muted: #78716c;
      --paper: #f7f5f2;
      --card: #fefefe;
      --dark: #1e1e1a;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.15);
    }
    
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); 
      background: var(--paper); 
      line-height: 1.6;
    }
    
    .top { 
      border-bottom: 1px solid #e7e5e1;
      background: var(--card);
    }
    
    .top-inner { 
      max-width: 1280px;
      margin: 0 auto; 
      padding: 0 3rem; 
      display: flex; 
      align-items: center; 
      gap: 0.5rem; 
      height: 72px; 
    }
    
    .logo { 
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--ink);
    }
    
    .mark { 
      width: 36px; 
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--dark);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    
    .wordmark {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }
    
    .container { 
      text-align: center; 
      padding: 5rem 3rem; 
    }
    
    h1 { 
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 5rem; 
      letter-spacing: -0.04em; 
      line-height: 1.15; 
      margin: 0 0 1rem; 
      font-weight: 400; 
      color: var(--muted); 
    }
    
    p { 
      font-size: 1.15rem; 
      color: var(--muted); 
      margin: 1rem 0; 
    }
    
    .btn { 
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem; 
      background: var(--dark); 
      color: #fff; 
      font: inherit; 
      font-weight: 600; 
      padding: 0.9rem 1.5rem; 
      border-radius: 8px; 
      text-decoration: none; 
      transition: opacity 0.15s;
    }
    
    .btn:hover { 
      opacity: 0.9; 
    }
    
    .btn::after {
      content: "→";
      font-size: 1.3rem;
    }
    
    @media (max-width: 768px) { 
      .top-inner {
        padding: 0 1.5rem;
        height: 64px;
      }
      
      .mark {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
      
      .wordmark {
        font-size: 1rem;
      }
      
      .container {
        padding: 3rem 1.5rem;
      }
      
      h1 {
        font-size: 3.5rem;
      }
      
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="top-inner">
      <a href="/" class="logo">
        <div class="mark">347</div>
        <span class="wordmark">Filed347</span>
      </a>
    </div>
  </div>
  
  <div class="container">
    <h1>404</h1>
    <p>Page not found.</p>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn">Back to home</a>
  </div>
</body>
</html>
