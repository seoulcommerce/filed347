<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Filed347</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { 
      --ink: #1c1917; 
      --muted: #57534e; 
      --line: #d6d3d1; 
      --paper: #f9f7f4;
      --card: #fff; 
      --accent: #0f172a;
    }
    
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); 
      background: var(--paper); 
      line-height: 1.65;
    }
    
    .top { 
      border-bottom: 1px solid var(--line); 
      background: var(--card); 
    }
    
    .top-inner { 
      max-width: 860px; 
      margin: 0 auto; 
      padding: 0 2rem; 
      display: flex; 
      align-items: center; 
      gap: 0.75rem; 
      height: 64px; 
    }
    
    .mark { 
      width: 32px; 
      height: 32px; 
    }
    
    .wordmark {
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }
    
    .container { 
      text-align: center; 
      padding: 5rem 2rem; 
    }
    
    h1 { 
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 4rem; 
      letter-spacing: -0.03em; 
      line-height: 1.15; 
      margin: 0 0 1rem; 
      font-weight: 400; 
      color: var(--muted); 
    }
    
    p { 
      font-size: 1.15rem; 
      color: var(--muted); 
      margin: 1rem 0; 
    }
    
    .btn { 
      display: inline-block; 
      margin-top: 2rem; 
      background: var(--accent); 
      color: #fff; 
      font: inherit; 
      font-weight: 600; 
      padding: 0.9rem 1.5rem; 
      border-radius: 8px; 
      text-decoration: none; 
      transition: opacity 0.15s;
    }
    
    .btn:hover { 
      opacity: 0.9; 
    }
    
    @media (max-width: 768px) { 
      .top-inner {
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }
      
      .container {
        padding: 3rem 1.25rem;
      }
      
      h1 {
        font-size: 3rem;
      }
      
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="top-inner">
      <a href="/" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit;">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="6" fill="#0f172a"/>
          <text x="16" y="21" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui" font-weight="700">347</text>
        </svg>
        <span class="wordmark">Filed347</span>
      </a>
    </div>
  </div>
  
  <div class="container">
    <h1>404</h1>
    <p>Page not found.</p>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn">Back to home</a>
  </div>
</body>
</html>
