<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks — Filed347</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --ink:#1c1917; --muted:#57534e; --line:#d6d3d1; --bg:#f5f4f1; --card:#fff; --acc:#1d4ed8; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }
    .top { border-bottom:1px solid var(--line); background:#fff; }
    .top .wrap, .wrap { max-width:900px; margin:0 auto; padding:0 1.25rem; }
    .top .wrap { display:flex; align-items:center; gap:.6rem; height:56px; }
    .mark { width:28px; height:28px; }
    .content { padding:2.5rem 0; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:2rem; margin:1.8rem 0; text-align:center; }
    h1 { font-size:2rem; letter-spacing:-.03em; line-height:1.15; margin:0 0 1rem; font-weight:700; }
    p { margin:.8rem 0; }
    .ok { color:#166534; font-weight:600; }
    .err { color:#b91c1c; font-weight:600; }
    .not { color:var(--muted); font-size:.92rem; }
    .btn { display:inline-block; margin:1.5rem .5rem .5rem; background:var(--acc); color:#fff; border:0; font:inherit; font-weight:650; padding:.9rem 1.5rem; border-radius:10px; cursor:pointer; text-decoration:none; transition:opacity .2s; }
    .btn:hover:not(:disabled) { opacity:.9; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn-secondary { background:#57534e; }
    @media (max-width: 768px) { 
      h1 { font-size:1.7rem; }
      .wrap { padding:0 1rem; }
    }
  </style>
</head>
<body>
  <div class="top"><div class="wrap">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#1d4ed8"/><text x="16" y="21" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui" font-weight="700">347</text></svg>
    <strong>Filed347</strong>
  </div></div>
  
  <div class="wrap">
    <div class="content">
      <div class="card">
        <h1>Thanks.</h1>
        <p id="msg">Looking up the WH-347…</p>
        <div id="dl"></div>
        <p class="not">Review the WH-347 and Statement of Compliance. Mark the boxes that apply. Sign it. We do not say you are compliant.</p>
        <a href="/" class="btn btn-secondary">Back to home</a>
      </div>
    </div>
  </div>
  
  <script>
    const params = new URLSearchParams(location.search);
    const downloadId = params.get("id") || "";
    const sessionId = params.get("session_id") || "";
    const msg = document.getElementById("msg");
    const dl = document.getElementById("dl");

    function addDownload(href) {
      const a = document.createElement("a");
      a.className = "btn";
      a.href = href;
      a.textContent = "Download WH-347 PDF";
      dl.appendChild(a);
    }

    function addBlobButton(body) {
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.textContent = "Download WH-347 PDF";
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          const pr = await fetch("/api/pdf", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(body)
          });
          if (!pr.ok) {
            msg.className = "err";
            msg.textContent = "Could not build the PDF.";
            btn.disabled = false;
            return;
          }
          const blob = await pr.blob();
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "filed347-wh347.pdf";
          a.click();
          btn.disabled = false;
        } catch (e) {
          msg.className = "err";
          msg.textContent = "Could not build the PDF.";
          btn.disabled = false;
        }
      };
      dl.appendChild(btn);
    }

    (async () => {
      if (downloadId) {
        msg.className = "ok";
        msg.textContent = "Your WH-347 is ready. Review it, mark the boxes, sign it, and file it.";
        addDownload("/api/pdf?id=" + encodeURIComponent(downloadId));
        return;
      }
      
      let saved = null;
      try {
        const raw = sessionStorage.getItem("filed347");
        if (raw) saved = JSON.parse(raw);
      } catch (_) {}
      
      if (sessionId) {
        try {
          const r = await fetch("/api/confirm?session_id=" + encodeURIComponent(sessionId));
          const data = await r.json();
          if (data && data.paid) {
            msg.className = "ok";
            msg.textContent = "Subscription received. Download the WH-347 built from the CSV you uploaded.";
            if (saved) addBlobButton(Object.assign({}, saved, { session_id: sessionId }));
            else {
              msg.className = "err";
              msg.textContent = "Payment is confirmed, but this browser no longer has the CSV. Generate the WH-347 again from the form.";
            }
            return;
          }
        } catch (_) {}
        msg.className = "err";
        msg.textContent = "We could not confirm that payment.";
        return;
      }
      
      if (saved && saved.csv) {
        msg.className = "ok";
        msg.textContent = "Download the WH-347 built from the CSV in this browser session.";
        addBlobButton(saved);
        return;
      }
      
      msg.className = "err";
      msg.textContent = "No PDF to download. Generate a WH-347 from the form.";
    })();
  </script>
</body>
</html>
