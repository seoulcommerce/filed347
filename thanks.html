<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filed347</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin:0; background:#f5f4f1; color:#1c1917; }
    .wrap { max-width:640px; margin:3rem auto; padding:0 1rem; }
    .ok { color:#166534; }
    .err { color:#b91c1c; }
    .btn { display:inline-block; margin-top:1rem; background:#1d4ed8; color:#fff; border:0; font:inherit; font-weight:750; padding:.75rem 1rem; border-radius:10px; cursor:pointer; text-decoration:none; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    a { color:inherit; }
    .not { color:#57534e; font-size:.92rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <p><strong>Filed347</strong></p>
    <h1>Thanks.</h1>
    <p id="msg">Checking the subscription…</p>
    <p id="dl"></p>
    <p class="not">Review the WH-347 and Statement of Compliance. Mark the boxes that apply. Sign it. We do not say you are compliant.</p>
    <p><a href="/">Back</a></p>
  </div>
  <script>
    const sessionId = new URLSearchParams(location.search).get("session_id") || "";
    const msg = document.getElementById("msg");
    const dl = document.getElementById("dl");
    (async () => {
      if (!sessionId) {
        msg.className = "err";
        msg.textContent = "No payment session. If you paid, email stevie@seoulwebdesign.com.";
        return;
      }
      try {
        const r = await fetch("/api/confirm?session_id=" + encodeURIComponent(sessionId));
        const data = await r.json();
        if (data && data.paid) {
          msg.className = "ok";
          msg.textContent = "Subscription received. Download the WH-347 built from the CSV you uploaded.";
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = "Download WH-347 PDF";
          btn.onclick = async () => {
            btn.disabled = true;
            let body = { session_id: sessionId };
            try {
              const saved = sessionStorage.getItem("filed347");
              if (saved) Object.assign(body, JSON.parse(saved));
            } catch (_) {}
            body.session_id = sessionId;
            const pr = await fetch("/api/pdf", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(body)
            });
            if (!pr.ok) {
              msg.className = "err";
              msg.textContent = "Could not build the PDF. Email stevie@seoulwebdesign.com if you were charged.";
              btn.disabled = false;
              return;
            }
            const blob = await pr.blob();
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "filed347-wh347.pdf";
            a.click();
            btn.disabled = false;
          };
          dl.appendChild(btn);
          return;
        }
      } catch (_) {}
      msg.className = "err";
      msg.textContent = "We could not confirm that payment. Email stevie@seoulwebdesign.com if you were charged.";
    })();
  </script>
</body>
</html>
