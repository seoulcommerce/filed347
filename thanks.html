<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks — Filed347</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { 
      --ink: #1c1917;
      --muted: #78716c;
      --paper: #f7f5f2;
      --card: #fefefe;
      --dark: #1e1e1a;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.15);
    }
    
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); 
      background: var(--paper); 
      line-height: 1.6;
    }
    
    .top { 
      border-bottom: 1px solid #e7e5e1;
      background: var(--card);
    }
    
    .top-inner { 
      max-width: 1280px;
      margin: 0 auto; 
      padding: 0 3rem; 
      display: flex; 
      align-items: center; 
      gap: 0.5rem; 
      height: 72px; 
    }
    
    .logo { 
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--ink);
    }
    
    .mark { 
      width: 36px; 
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--dark);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    
    .wordmark {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }
    
    .container { 
      max-width: 860px; 
      margin: 0 auto; 
      padding: 3rem 3rem 4rem; 
    }
    
    .card {
      background: var(--card);
      border: 1px solid #e7e5e1;
      border-radius: 12px;
      padding: 3rem 2.5rem;
      margin: 2rem 0;
      text-align: center;
    }
    
    h1 { 
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 2.5rem; 
      letter-spacing: -0.03em; 
      margin: 0 0 1rem; 
      font-weight: 400;
    }
    
    p { 
      margin: 1rem 0; 
      line-height: 1.7;
      font-size: 1rem;
    }
    
    .success { 
      color: #166534; 
      font-weight: 600; 
    }
    
    .error { 
      color: #b91c1c; 
      font-weight: 600; 
    }
    
    .notice { 
      color: var(--muted); 
      font-size: 0.95rem; 
      margin-top: 1.5rem;
    }
    
    .btn { 
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin: 1.5rem 0.5rem 0.5rem; 
      background: var(--dark); 
      color: #fff; 
      border: 0; 
      font: inherit; 
      font-weight: 600; 
      padding: 0.9rem 1.5rem; 
      border-radius: 8px; 
      cursor: pointer; 
      text-decoration: none; 
      transition: opacity 0.15s;
    }
    
    .btn:hover:not(:disabled) { 
      opacity: 0.9; 
    }
    
    .btn:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
    }
    
    .btn::after {
      content: "→";
      font-size: 1.3rem;
    }
    
    .btn-secondary { 
      background: #78716c;
    }
    
    @media (max-width: 768px) { 
      .top-inner {
        padding: 0 1.5rem;
        height: 64px;
      }
      
      .mark {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
      
      .wordmark {
        font-size: 1rem;
      }
      
      .container {
        padding: 2rem 1.5rem 3rem;
      }
      
      .card {
        padding: 2rem 1.5rem;
      }
      
      h1 { 
        font-size: 2rem; 
      }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="top-inner">
      <a href="/" class="logo">
        <div class="mark">347</div>
        <span class="wordmark">Filed347</span>
      </a>
    </div>
  </div>
  
  <div class="container">
    <div class="card">
      <h1>Thanks.</h1>
      <p id="msg">Looking up the WH-347…</p>
      <div id="dl"></div>
      <p class="notice">Review the WH-347 and Statement of Compliance. Mark the boxes that apply. Sign it. We do not say you are compliant.</p>
      <a href="/" class="btn btn-secondary">Back to home</a>
    </div>
  </div>
  
  <script>
    const params = new URLSearchParams(location.search);
    const downloadId = params.get("id") || "";
    const sessionId = params.get("session_id") || "";
    const msg = document.getElementById("msg");
    const dl = document.getElementById("dl");

    function addDownload(href) {
      const a = document.createElement("a");
      a.className = "btn";
      a.href = href;
      a.textContent = "Download WH-347 PDF";
      dl.appendChild(a);
    }

    function addBlobButton(body) {
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.textContent = "Download WH-347 PDF";
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          const endpoint = body.session_id ? "/api/generate" : "/api/preview";
          const pr = await fetch(endpoint, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(body)
          });
          if (!pr.ok) {
            msg.className = "error";
            msg.textContent = "Could not build the PDF.";
            btn.disabled = false;
            return;
          }
          const blob = await pr.blob();
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "filed347-wh347.pdf";
          a.click();
          btn.disabled = false;
        } catch (e) {
          msg.className = "error";
          msg.textContent = "Could not build the PDF.";
          btn.disabled = false;
        }
      };
      dl.appendChild(btn);
    }

    (async () => {
      if (downloadId) {
        msg.className = "success";
        msg.textContent = "Your WH-347 is ready. Review it, mark the boxes, sign it, and file it.";
        addDownload("/api/pdf?id=" + encodeURIComponent(downloadId));
        return;
      }
      
      let saved = null;
      try {
        const raw = sessionStorage.getItem("filed347");
        if (raw) saved = JSON.parse(raw);
      } catch (_) {}
      
      if (sessionId) {
        try {
          const r = await fetch("/api/confirm?session_id=" + encodeURIComponent(sessionId));
          const data = await r.json();
          if (data && data.paid) {
            msg.className = "success";
            msg.textContent = "Subscription received. Download the WH-347 built from the CSV you uploaded.";
            if (saved) addBlobButton(Object.assign({}, saved, { session_id: sessionId }));
            else {
              msg.className = "error";
              msg.textContent = "Payment is confirmed, but this browser no longer has the CSV. Generate the WH-347 again from the form.";
            }
            return;
          }
        } catch (_) {}
        msg.className = "error";
        msg.textContent = "We could not confirm that payment.";
        return;
      }
      
      if (saved && saved.csv) {
        msg.className = "success";
        msg.textContent = "Download the WH-347 built from the CSV in this browser session.";
        addBlobButton(saved);
        return;
      }
      
      msg.className = "error";
      msg.textContent = "No PDF to download. Generate a WH-347 from the form.";
    })();
  </script>
</body>
</html>
