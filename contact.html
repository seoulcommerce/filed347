<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Filed347</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { 
      --ink: #1c1917;
      --muted: #78716c;
      --paper: #f7f5f2;
      --card: #fefefe;
      --dark: #1e1e1a;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.15);
    }
    
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); 
      background: var(--paper); 
      line-height: 1.6;
    }
    
    .top { 
      border-bottom: 1px solid #e7e5e1;
      background: var(--card);
    }
    
    .top-inner { 
      max-width: 1280px;
      margin: 0 auto; 
      padding: 0 3rem; 
      display: flex; 
      align-items: center; 
      gap: 0.5rem; 
      height: 72px; 
    }
    
    .logo { 
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--ink);
    }
    
    .mark { 
      width: 36px; 
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--dark);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    
    .wordmark {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }
    
    .container { 
      max-width: 860px; 
      margin: 0 auto; 
      padding: 3rem 3rem 4rem; 
    }
    
    h1 { 
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 2.5rem; 
      letter-spacing: -0.03em; 
      margin: 0 0 1rem; 
      font-weight: 400;
    }
    
    .intro {
      margin: 1rem 0 2.5rem;
      line-height: 1.7;
      font-size: 1rem;
    }
    
    .card {
      background: var(--card);
      border: 1px solid #e7e5e1;
      border-radius: 12px;
      padding: 2.5rem;
      margin: 2rem 0;
    }
    
    label { 
      display: block; 
      font-weight: 600; 
      margin: 1.25rem 0 0.5rem; 
      font-size: 0.95rem; 
    }
    
    input, textarea { 
      width: 100%; 
      box-sizing: border-box;
      font: inherit; 
      padding: 0.75rem 1rem; 
      border: 1px solid #d6d3d1; 
      border-radius: 6px; 
      background: #fff; 
      font-size: 1rem; 
    }
    
    textarea { 
      min-height: 10rem; 
      resize: vertical; 
    }
    
    .btn { 
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%; 
      justify-content: center;
      margin-top: 1.5rem; 
      border: 0; 
      background: var(--dark); 
      color: #fff; 
      font: inherit; 
      font-weight: 600; 
      padding: 1.1rem 2rem; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 1.05rem; 
      transition: opacity 0.15s;
    }
    
    .btn:hover:not(:disabled) { 
      opacity: 0.9; 
    }
    
    .btn:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
    }
    
    .btn::after {
      content: "→";
      font-size: 1.3rem;
    }
    
    .notice {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 1rem;
      line-height: 1.5;
    }
    
    .success-message { 
      color: #166534; 
      font-weight: 600; 
      margin-top: 1rem; 
    }
    
    .error-message { 
      color: #b91c1c; 
      font-weight: 600; 
      margin-top: 1rem; 
    }
    
    footer { 
      background: var(--dark);
      color: #a8a29e;
      padding: 2.5rem 0;
      margin-top: 3rem;
    }
    
    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 3rem;
    }
    
    footer p {
      margin: 0.5rem 0;
      font-size: 0.95rem;
    }
    
    footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    
    @media (max-width: 768px) { 
      .top-inner {
        padding: 0 1.5rem;
        height: 64px;
      }
      
      .mark {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
      
      .wordmark {
        font-size: 1rem;
      }
      
      .container {
        padding: 2rem 1.5rem 3rem;
      }
      
      .card {
        padding: 1.5rem;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .footer-inner {
        padding: 0 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="top-inner">
      <a href="/" class="logo">
        <div class="mark">347</div>
        <span class="wordmark">Filed347</span>
      </a>
    </div>
  </div>
  
  <div class="container">
    <h1>Contact</h1>
    <p class="intro">Questions about Filed347? Use this form. We do not accept payroll CSVs by email. Do not send payroll files, employee names, or SSNs.</p>
    
    <form class="card" id="contact-form">
      <label for="name">Your name</label>
      <input id="name" required maxlength="100">
      
      <label for="reply-email">Reply email</label>
      <input id="reply-email" type="email" required maxlength="200">
      
      <label for="message">Message</label>
      <textarea id="message" required maxlength="2000"></textarea>
      
      <button class="btn" type="submit" id="submit-btn">Send message</button>
      <p class="notice" id="note">We review messages but there is no product inbox yet.</p>
      <p class="success-message" id="success" hidden></p>
      <p class="error-message" id="error" hidden></p>
    </form>
  </div>

  <footer>
    <div class="footer-inner">
      <p>Filed347. Software. Not a legal opinion.</p>
      <p><a href="/">Home</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
    </div>
  </footer>
  
  <script>
    const form = document.getElementById("contact-form");
    const submitBtn = document.getElementById("submit-btn");
    const success = document.getElementById("success");
    const error = document.getElementById("error");
    
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      success.hidden = true;
      error.hidden = true;
      submitBtn.disabled = true;
      
      try {
        const r = await fetch("/api/contact", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            replyEmail: document.getElementById("reply-email").value,
            message: document.getElementById("message").value
          })
        });
        
        const data = await r.json();
        
        if (!r.ok) {
          error.hidden = false;
          error.textContent = data.error || "Could not send message. Try again.";
          submitBtn.disabled = false;
          return;
        }
        
        success.hidden = false;
        success.textContent = "Message received. Thank you.";
        form.reset();
        submitBtn.disabled = false;
      } catch (err) {
        error.hidden = false;
        error.textContent = "Could not send message. Check your connection.";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
