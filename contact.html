<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Filed347</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { 
      --ink: #1c1917; 
      --muted: #57534e; 
      --line: #d6d3d1; 
      --paper: #f9f7f4;
      --card: #fff; 
      --accent: #0f172a;
    }
    
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); 
      background: var(--paper); 
      line-height: 1.65;
    }
    
    .top { 
      border-bottom: 1px solid var(--line); 
      background: var(--card); 
    }
    
    .top-inner { 
      max-width: 860px; 
      margin: 0 auto; 
      padding: 0 2rem; 
      display: flex; 
      align-items: center; 
      gap: 0.75rem; 
      height: 64px; 
    }
    
    .mark { 
      width: 32px; 
      height: 32px; 
    }
    
    .wordmark {
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }
    
    .container { 
      max-width: 860px; 
      margin: 0 auto; 
      padding: 3rem 2rem 4rem; 
    }
    
    h1 { 
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 2.5rem; 
      letter-spacing: -0.03em; 
      margin: 0 0 1rem; 
      font-weight: 400;
    }
    
    .intro {
      margin: 1rem 0 2.5rem;
      line-height: 1.6;
    }
    
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 2.5rem;
      margin: 2rem 0;
    }
    
    label { 
      display: block; 
      font-weight: 600; 
      margin: 1.25rem 0 0.5rem; 
      font-size: 0.95rem; 
    }
    
    input, textarea { 
      width: 100%; 
      box-sizing: border-box;
      font: inherit; 
      padding: 0.75rem 1rem; 
      border: 1px solid #c4c0ba; 
      border-radius: 6px; 
      background: #fff; 
      font-size: 1rem; 
    }
    
    textarea { 
      min-height: 10rem; 
      resize: vertical; 
    }
    
    .btn { 
      display: block; 
      width: 100%; 
      margin-top: 1.5rem; 
      border: 0; 
      background: var(--accent); 
      color: #fff; 
      font: inherit; 
      font-weight: 600; 
      padding: 1rem; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 1.05rem; 
      transition: opacity 0.15s;
    }
    
    .btn:hover:not(:disabled) { 
      opacity: 0.9; 
    }
    
    .btn:disabled { 
      opacity: 0.5; 
      cursor: not-allowed; 
    }
    
    .notice {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 1rem;
      line-height: 1.5;
    }
    
    .success-message { 
      color: #166534; 
      font-weight: 600; 
      margin-top: 1rem; 
    }
    
    .error-message { 
      color: #b91c1c; 
      font-weight: 600; 
      margin-top: 1rem; 
    }
    
    footer { 
      color: #78716c; 
      font-size: 0.95rem; 
      padding-top: 3rem; 
      margin-top: 3rem;
      border-top: 1px solid var(--line);
    }
    
    footer p {
      margin: 0.5rem 0;
    }
    
    footer a { 
      color: inherit; 
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    
    @media (max-width: 768px) { 
      .top-inner,
      .container {
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }
      
      .card {
        padding: 1.5rem;
      }
      
      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="top-inner">
      <a href="/" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit;">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="6" fill="#0f172a"/>
          <text x="16" y="21" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui" font-weight="700">347</text>
        </svg>
        <span class="wordmark">Filed347</span>
      </a>
    </div>
  </div>
  
  <div class="container">
    <h1>Contact</h1>
    <p class="intro">Questions about Filed347? Use this form. We do not accept payroll CSVs by email. Do not send payroll files, employee names, or SSNs.</p>
    
    <form class="card" id="contact-form">
      <label for="name">Your name</label>
      <input id="name" required maxlength="100">
      
      <label for="reply-email">Reply email</label>
      <input id="reply-email" type="email" required maxlength="200">
      
      <label for="message">Message</label>
      <textarea id="message" required maxlength="2000"></textarea>
      
      <button class="btn" type="submit" id="submit-btn">Send message</button>
      <p class="notice" id="note">We review messages but there is no product inbox yet.</p>
      <p class="success-message" id="success" hidden></p>
      <p class="error-message" id="error" hidden></p>
    </form>

    <footer>
      <p>Filed347. Software. Not a legal opinion.</p>
      <p><a href="/">Home</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
    </footer>
  </div>
  
  <script>
    const form = document.getElementById("contact-form");
    const submitBtn = document.getElementById("submit-btn");
    const success = document.getElementById("success");
    const error = document.getElementById("error");
    
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      success.hidden = true;
      error.hidden = true;
      submitBtn.disabled = true;
      
      try {
        const r = await fetch("/api/contact", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            replyEmail: document.getElementById("reply-email").value,
            message: document.getElementById("message").value
          })
        });
        
        const data = await r.json();
        
        if (!r.ok) {
          error.hidden = false;
          error.textContent = data.error || "Could not send message. Try again.";
          submitBtn.disabled = false;
          return;
        }
        
        success.hidden = false;
        success.textContent = "Message received. Thank you.";
        form.reset();
        submitBtn.disabled = false;
      } catch (err) {
        error.hidden = false;
        error.textContent = "Could not send message. Check your connection.";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
